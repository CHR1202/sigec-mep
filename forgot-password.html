<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGEC | Recuperar contraseña</title>
  <link rel="stylesheet" href="styles.css?v=7">
  <style>
    body{background:#f7f9fc;min-height:100vh;display:grid;place-items:center;padding:24px}
    .auth-card{width:min(520px,100%);background:#fff;border:1px solid #e6ecf4;border-radius:16px;box-shadow:0 16px 40px rgba(17,39,76,.10);padding:30px}
    .auth-brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}
    .auth-brand img{width:64px;height:64px;object-fit:contain}
    .auth-brand h1{margin:0;font-size:30px}
    .auth-brand p{margin:4px 0 0;color:#60708a;font-size:13px}
    .auth-form{display:grid;gap:12px;margin-top:22px}
    .auth-form label{font-size:13px;font-weight:700}
    .status-box{margin-top:16px;padding:12px 14px;border-radius:9px;font-size:12px;line-height:1.5}
    .status-box.error{background:#fff1f1;color:#a93434}
    .status-box.success{background:#e8f8f2;color:#087a58}
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="auth-brand">
      <img src="assets/img/logo-sigec-icon.png" alt="SIGEC">
      <div>
        <h1>SIGEC</h1>
        <p>Sistema de Gestión de Convivencia Escolar</p>
      </div>
    </div>

    <span class="soft-badge">Recuperación</span>
    <h2>¿Olvidó su contraseña?</h2>
    <p>Ingrese su correo y, si existe una cuenta asociada, recibirá un enlace para crear una nueva contraseña.</p>

    <form id="forgot-password-form" class="auth-form">
      <label for="recovery-email">Correo electrónico *</label>
      <input id="recovery-email" type="email" autocomplete="email" required>
      <button type="submit" class="btn btn-primary">Enviar enlace</button>
    </form>

    <div id="recovery-status" class="status-box hidden"></div>

    <div style="margin-top:18px;text-align:center">
      <a href="https://chr1202.github.io/sigec-mep/" style="color:#2f65d9;font-weight:700;font-size:12px">Volver al inicio de sesión</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const client = window.supabase.createClient(
      "https://oadyuziwvsmgkvwwbsbm.supabase.co",
      "sb_publishable_RHQxs3frzGigWAkUdVX-Hg_kNj9xU5B"
    );

    const form = document.getElementById("forgot-password-form");
    const statusBox = document.getElementById("recovery-status");

    function setStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = "status-box " + type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("recovery-email").value.trim();
      const button = form.querySelector("button");

      button.disabled = true;
      button.textContent = "Enviando…";

      try {
        const { error } = await client.auth.resetPasswordForEmail(email, {
          redirectTo: "https://chr1202.github.io/sigec-mep/set-password.html"
        });

        if (error) throw error;

        setStatus("Si el correo pertenece a una cuenta de SIGEC, recibirá un enlace para establecer una nueva contraseña.", "success");
        form.reset();
      } catch (error) {
        console.error(error);
        setStatus("No fue posible enviar el enlace: " + (error.message || error), "error");
      } finally {
        button.disabled = false;
        button.textContent = "Enviar enlace";
      }
    });
  </script>
</body>
</html>
