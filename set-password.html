<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGEC | Crear contraseña</title>
  <link rel="stylesheet" href="styles.css?v=7">
  <style>
    body{background:#f7f9fc;min-height:100vh;display:grid;place-items:center;padding:24px}
    .auth-card{width:min(520px,100%);background:#fff;border:1px solid #e6ecf4;border-radius:16px;box-shadow:0 16px 40px rgba(17,39,76,.10);padding:30px}
    .auth-brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}
    .auth-brand img{width:64px;height:64px;object-fit:contain}
    .auth-brand h1{margin:0;font-size:30px}
    .auth-brand p{margin:4px 0 0;color:#60708a;font-size:13px}
    .auth-form{display:grid;gap:12px;margin-top:22px}
    .auth-form label{font-size:13px;font-weight:700}
    .status-box{margin-top:16px;padding:12px 14px;border-radius:9px;font-size:12px;line-height:1.5}
    .status-box.error{background:#fff1f1;color:#a93434}
    .status-box.success{background:#e8f8f2;color:#087a58}
    .status-box.info{background:#edf6ff;color:#315986}
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="auth-brand">
      <img src="assets/img/logo-sigec-icon.png" alt="SIGEC">
      <div>
        <h1>SIGEC</h1>
        <p>Sistema de Gestión de Convivencia Escolar</p>
      </div>
    </div>

    <span class="soft-badge">Primer acceso</span>
    <h2>Crear contraseña</h2>
    <p>Defina la contraseña que utilizará para iniciar sesión en SIGEC.</p>

    <form id="set-password-form" class="auth-form">
      <label for="new-password">Nueva contraseña *</label>
      <input id="new-password" type="password" minlength="8" autocomplete="new-password" required>

      <label for="confirm-password">Confirmar contraseña *</label>
      <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required>

      <button type="submit" class="btn btn-primary">Guardar contraseña</button>
    </form>

    <div id="password-status" class="status-box info">Validando el enlace…</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const client = window.supabase.createClient(
      "https://oadyuziwvsmgkvwwbsbm.supabase.co",
      "sb_publishable_RHQxs3frzGigWAkUdVX-Hg_kNj9xU5B"
    );

    const form = document.getElementById("set-password-form");
    const statusBox = document.getElementById("password-status");

    function setStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = "status-box " + type;
    }

    async function initializeSession() {
      try {
        const hash = new URLSearchParams(window.location.hash.substring(1));
        const query = new URLSearchParams(window.location.search);

        const accessToken = hash.get("access_token");
        const refreshToken = hash.get("refresh_token");
        const code = query.get("code");

        if (accessToken && refreshToken) {
          const { error } = await client.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (error) throw error;
        } else if (code) {
          const { error } = await client.auth.exchangeCodeForSession(code);
          if (error) throw error;
        }

        const { data: { session } } = await client.auth.getSession();

        if (!session) {
          setStatus("El enlace no contiene una sesión válida o ya expiró.", "error");
          form.querySelector("button").disabled = true;
          return;
        }

        setStatus("Enlace válido. Ya puede crear su contraseña.", "success");
      } catch (error) {
        console.error(error);
        setStatus("No fue posible validar el enlace: " + (error.message || error), "error");
        form.querySelector("button").disabled = true;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("new-password").value;
      const confirmation = document.getElementById("confirm-password").value;
      const button = form.querySelector("button");

      if (password.length < 8) {
        setStatus("La contraseña debe tener al menos 8 caracteres.", "error");
        return;
      }

      if (password !== confirmation) {
        setStatus("Las contraseñas no coinciden.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Guardando…";

      try {
        const { error } = await client.auth.updateUser({ password });
        if (error) throw error;

        setStatus("Contraseña creada correctamente. Redirigiendo al inicio de sesión…", "success");
        await client.auth.signOut();

        setTimeout(() => {
          window.location.href = "https://chr1202.github.io/sigec-mep/";
        }, 1500);
      } catch (error) {
        console.error(error);
        setStatus("No fue posible guardar la contraseña: " + (error.message || error), "error");
        button.disabled = false;
        button.textContent = "Guardar contraseña";
      }
    });

    initializeSession();
  </script>
</body>
</html>
